name: Rollback to Previous Version

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment to rollback (dev, qa, stage, prod, main)'
        required: true
        type: choice
        options:
          - dev
          - qa
          - stage
          - prod
          - main
      rollback_tag:
        description: 'Git tag to rollback to (e.g., v1.0.12)'
        required: true

permissions:
  deployments: write # Allows the workflow to trigger other workflows
  contents: write  # Allows the workflow to write to the repository

jobs:
  rollback:
    name: Rollback ${{ github.event.inputs.environment }} to ${{ github.event.inputs.rollback_tag }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Tag Exists
        run: |
          TAG="${{ github.event.inputs.rollback_tag }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "❌ Tag $TAG does not exist"
            exit 1
          else
            echo "✅ Tag $TAG found"
          fi

      - name: Rollback Branch to Tag (without workflow files)
        run: |
          ENV="${{ github.event.inputs.environment }}"
          TAG="${{ github.event.inputs.rollback_tag }}"
          BRANCH="deploy/$ENV"
          echo "🔁 Preparing to rollback $BRANCH to tag $TAG"
      
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
      
          git fetch --all
      
          if git ls-remote --exit-code --heads origin "$BRANCH"; then
            echo "✅ Branch $BRANCH exists. Checking out."
            git checkout "$BRANCH"
          else
            echo "⚠️ Branch $BRANCH does not exist. Creating it from tag $TAG"
            git checkout -b "$BRANCH" "$TAG"
          fi
      
          echo "🚫 Excluding .github/workflows/* from rollback"
          git checkout "$TAG" -- .
          rm -rf .github/workflows
      
          echo "📤 Committing rollback (excluding workflow files)"
          git add -A
          git commit -m "Rollback $BRANCH to $TAG (excluding workflow files)" || echo "No changes to commit"
      
          echo "📤 Pushing branch $BRANCH to origin"
          git push origin "$BRANCH" --force


          echo "📤 Pushing branch $BRANCH to origin (force)"
          git push origin "$BRANCH" --force
