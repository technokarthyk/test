name: Rollback to Previous Version

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment to rollback (dev, qa, stage, prod, main)'
        required: true
        type: choice
        options:
          - dev
          - qa
          - stage
          - prod
          - main
      rollback_tag:
        description: 'Git tag to rollback to (e.g., v1.0.12)'
        required: true

permissions:
  deployments: write
  contents: write

jobs:
  rollback:
    name: Rollback ${{ github.event.inputs.environment }} to ${{ github.event.inputs.rollback_tag }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Tag Exists
        run: |
          TAG="${{ github.event.inputs.rollback_tag }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "❌ Tag $TAG does not exist"
            exit 1
          else
            echo "✅ Tag $TAG found"
          fi

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Rollback Branch to Tag (excluding workflow files)
        run: |
          ENV="${{ github.event.inputs.environment }}"
          TAG="${{ github.event.inputs.rollback_tag }}"
          BRANCH="deploy/$ENV"
          echo "🔁 Preparing to rollback $BRANCH to tag $TAG"

          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          git fetch --all

          if git ls-remote --exit-code --heads origin "$BRANCH"; then
            echo "✅ Branch $BRANCH
