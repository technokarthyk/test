name: Rollback to Previous Version

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment to rollback (dev, qa, stage, prod)'
        required: true
        type: choice
        options:
          - dev
          - qa
          - stage
          - prod
          - main
      rollback_tag:
        description: 'Git tag to rollback to (e.g., v1.0.12)'
        required: true

permissions:
  contents: write

jobs:
  rollback:
    name: Rollback ${{ github.event.inputs.environment }} to ${{ github.event.inputs.rollback_tag }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Ensure we get all tags and branches

      - name: Verify Tag Exists
        run: |
          TAG="${{ github.event.inputs.rollback_tag }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "❌ Tag $TAG does not exist"
            exit 1
          else
            echo "✅ Tag $TAG found"
          fi

      - name: Rollback Branch to Tag
        run: |
          ENV="${{ github.event.inputs.environment }}"
          TAG="${{ github.event.inputs.rollback_tag }}"
          BRANCH="deploy/$ENV"

          echo "🔁 Preparing to rollback $BRANCH to tag $TAG"

          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # Fetch all branches and tags
          git fetch --all

          # Check if the branch exists remotely
          if git ls-remote --exit-code --heads origin "$BRANCH"; then
            echo "✅ Branch $BRANCH exists"
            git checkout "$BRANCH"
          else
            echo "⚠️ Branch $BRANCH does not exist. Creating from tag $TAG"
            git checkout -b "$BRANCH" "$TAG"
          fi

          echo "🚀 Resetting branch $BRANCH to tag $TAG"
          git reset --hard "$TAG"
          git push origin "$BRANCH" --force
