name: Manual Deploy to Environment

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git Tag (e.g., v1.0.0)'
        required: true
        type: string
      environment:
        description: 'Target Environment (dev, qa, prod)'
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Show selected inputs
        run: |
          echo "Selected tag: ${{ github.event.inputs.tag }}"
          echo "Selected environment: ${{ github.event.inputs.environment }}"

      - name: Deploy to selected environment
        run: |
          case "${{ github.event.inputs.environment }}" in
            dev)
              echo "Deploying tag ${{ github.event.inputs.tag }} to DEV"
              # Add your DEV deployment logic here
              ;;
            qa)
              echo "Deploying tag ${{ github.event.inputs.tag }} to QA"
              # Add your QA deployment logic here
              ;;
            prod)
              echo "Deploying tag ${{ github.event.inputs.tag }} to PROD"
              # Add your PROD deployment logic here
              ;;
            *)
              echo "Unknown environment selected"
              exit 1
              ;;
          esac
