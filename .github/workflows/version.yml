name: Deploy to Environment

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python (or Node, .NET, etc.)
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Extract tag version
        id: extract_tag
        run: |
          echo "TAG_NAME=${GITHUB_REF##*/}" >> $GITHUB_ENV
          echo "Tag name is ${{ env.TAG_NAME }}"

      - name: Deploy based on tag
        run: |
          if [[ "${{ env.TAG_NAME }}" == "v1.0.0" ]]; then
            echo "Deploying to DEV"
            # your deployment logic here
          elif [[ "${{ env.TAG_NAME }}" == "v1.0.1" ]]; then
            echo "Deploying to QA"
            # your deployment logic here
          elif [[ "${{ env.TAG_NAME }}" == "v2.0.0" ]]; then
            echo "Deploying to PROD"
            # your deployment logic here
          else
            echo "Tag does not match any environment"
            exit 1
          fi
