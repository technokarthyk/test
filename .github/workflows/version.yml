name: Manual Deploy Across Branches

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Source branch (where this workflow is triggered from)'
        required: true
        type: string
        default: dev
      destination_branch:
        description: 'Destination branch (to deploy code to)'
        required: true
        type: choice
        options:
          - dev
          - qa
          - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Show inputs
        run: |
          echo "Triggered from source branch: ${{ github.event.inputs.source_branch }}"
          echo "Deploying to destination branch: ${{ github.event.inputs.destination_branch }}"

      - name: Checkout source branch
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.source_branch }}

      - name: Merge into destination branch (simulated)
        run: |
          echo "Simulating merge or deployment logic from ${{ github.event.inputs.source_branch }} to ${{ github.event.inputs.destination_branch }}"
          # Actual deployment or merge commands go here
