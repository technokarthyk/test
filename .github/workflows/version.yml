name: Manual Deploy to Environment

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git Tag (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Read tag input
        run: |
          echo "TAG_NAME=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          echo "Tag name provided: ${{ github.event.inputs.tag }}"

      - name: Deploy based on tag
        run: |
          if [[ "${{ env.TAG_NAME }}" == "v1.0.0" ]]; then
            echo "Deploying to DEV"
            # Add your DEV deployment logic here
          elif [[ "${{ env.TAG_NAME }}" == "v1.0.1" ]]; then
            echo "Deploying to QA"
            # Add your QA deployment logic here
          elif [[ "${{ env.TAG_NAME }}" == "v2.0.0" ]]; then
            echo "Deploying to PROD"
            # Add your PROD deployment logic here
          else
            echo "Unknown tag, no matching environment."
            exit 1
          fi
