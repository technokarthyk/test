name: Manual Rollback

on:
  workflow_dispatch:
    inputs:
      commit_id:
        description: "Enter the commit ID to roll back to (e.g., abc1234)"
        required: true
        type: string
      version:
        description: "Enter the version number to roll back to (e.g., v1.0.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest

    steps:
      - name: Docker Login to ACR
        uses: azure/docker-login@v1
        with:
          login-server: spiritacr.azurecr.io
          username: spiritacr
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Pull and Re-tag Image
        run: |
          echo "Rolling back to commit ID: ${{ github.event.inputs.commit_id }} and version: ${{ github.event.inputs.version }}"
          docker pull spiritacr.azurecr.io/sds-reports-api:${{ github.event.inputs.commit_id }}
          docker tag spiritacr.azurecr.io/sds-reports-api:${{ github.event.inputs.commit_id }} spiritacr.azurecr.io/sds-reports-api:latest
          docker push spiritacr.azurecr.io/sds-reports-api:latest
