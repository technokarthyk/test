name: Auto Deploy on Tag

on:
  push:
    tags:
      - 'v*'  # Trigger for tags like v1.0.0, v1.1.1 etc.

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Extract tag and decide environment
        id: set-env
        run: |
          TAG_NAME="${GITHUB_REF##*/}"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

          # Decide environment based on tag
          if [[ "$TAG_NAME" == v1.* ]]; then
            echo "DEPLOY_ENV=dev" >> $GITHUB_ENV
          elif [[ "$TAG_NAME" == v2.* ]]; then
            echo "DEPLOY_ENV=qa" >> $GITHUB_ENV
          elif [[ "$TAG_NAME" == v3.* ]]; then
            echo "DEPLOY_ENV=prod" >> $GITHUB_ENV
          else
            echo "Unknown tag pattern: $TAG_NAME"
            exit 1
          fi

      - name: Show chosen environment
        run: |
          echo "Tag: $TAG_NAME"
          echo "Deploying to environment: $DEPLOY_ENV"

      - name: Deploy
        run: |
          echo "🚀 Deploying tag $TAG_NAME to $DEPLOY_ENV environment"
          # Insert real deployment commands here
